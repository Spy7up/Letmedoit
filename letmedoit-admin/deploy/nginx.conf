# letmedoit 管理后台 nginx 配置
# 前端接口前缀 /admin-api 由这里反代到后端，浏览器看到的始终是同源地址

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 上传体积上限（按后端需要调整）
    client_max_body_size 20m;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types      text/plain text/css text/javascript
                    application/javascript application/json
                    application/xml image/svg+xml;

    # ---------------- 后端接口反向代理 ----------------
    # /admin-api/login/getCaptcha  ->  http://192.168.31.79:8082/login/getCaptcha
    # 换后端地址：改下面一行重新打包，或用 deploy.sh -b http://新地址:8082
    location /admin-api/ {
        proxy_pass http://192.168.31.79:8082/;

        proxy_http_version 1.1;
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    # ---------------- 静态资源 ----------------
    # 文件名带 hash，可长期缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 入口页不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA 兜底（当前是 hash 路由，留着防止以后改 history 模式 404）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
