<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>让我做管理后台 - 首版原型</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1f2329;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.shell{display:flex;min-height:100vh}.side{width:220px;background:#001529;color:#d7e3f4;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:18px;font-weight:700;padding:0 10px 24px}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#1677ff}.nav button{width:100%;border:0;background:transparent;color:#b8c7da;text-align:left;padding:12px 14px;border-radius:6px;cursor:pointer;margin:2px 0}.nav button.active,.nav button:hover{background:#1677ff;color:#fff}.main{flex:1;min-width:0}.top{height:60px;background:#fff;border-bottom:1px solid #e8edf3;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.crumb{color:#687386}.user{display:flex;align-items:center;gap:9px}.avatar{display:inline-grid;place-items:center;border-radius:50%;width:34px;height:34px;background:#e6f4ff;color:#1677ff;font-weight:700}.content{padding:20px 24px 36px;max-width:1600px;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.page-title h1{font-size:22px;margin:0}.muted{color:#8490a3}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(6,minmax(130px,1fr))}.card{background:#fff;border:1px solid #edf0f5;border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(31,35,41,.02)}.metric{border-left:3px solid #1677ff}.metric .label{color:#687386}.metric strong{display:block;font-size:28px;line-height:1.3;margin:8px 0 2px}.metric small{color:#52c41a}.two{grid-template-columns:2fr 1fr;margin-top:14px}.three{grid-template-columns:repeat(3,1fr);margin-top:14px}.card h3{font-size:15px;margin:0 0 14px}.chart{height:250px;display:flex;align-items:flex-end;gap:12px;padding:28px 12px 24px;border-bottom:1px solid #e8edf3;background:linear-gradient(180deg,#fff,#f8fbff)}.bar{flex:1;background:linear-gradient(180deg,#69b1ff,#1677ff);border-radius:4px 4px 0 0;min-width:12px;position:relative}.bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:11px;color:#8490a3;white-space:nowrap}.donut{width:158px;height:158px;border-radius:50%;margin:22px auto;background:conic-gradient(#1677ff 0 42%,#52c41a 42% 70%,#faad14 70% 86%,#ff4d4f 86% 94%,#d9d9d9 94%);display:grid;place-items:center}.donut:after{content:"任务状态";display:grid;place-items:center;width:92px;height:92px;background:#fff;border-radius:50%;color:#687386}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.field label{display:block;color:#687386;font-size:12px;margin-bottom:5px}.input,select{height:34px;border:1px solid #d9dfe8;border-radius:6px;background:#fff;padding:0 11px;min-width:180px}.btn{height:34px;border:1px solid #d9dfe8;background:#fff;border-radius:6px;padding:0 16px;cursor:pointer}.btn.primary{background:#1677ff;border-color:#1677ff;color:#fff}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{background:#fafafa;color:#596579;text-align:left;font-weight:600}th,td{padding:12px 14px;border-bottom:1px solid #edf0f5;white-space:nowrap}.link{color:#1677ff;cursor:pointer}.tag{display:inline-block;border-radius:4px;padding:2px 8px;background:#f2f3f5;color:#596579}.tag.blue{background:#e6f4ff;color:#1677ff}.tag.green{background:#f6ffed;color:#389e0d}.tag.orange{background:#fff7e6;color:#d48806}.tag.red{background:#fff1f0;color:#cf1322}.profile{display:flex;gap:16px;align-items:center}.profile .avatar{width:64px;height:64px;font-size:24px}.gauge{display:grid;place-items:center;width:160px;height:90px;margin:14px auto 0;border-radius:160px 160px 0 0;background:conic-gradient(from 270deg at 50% 100%,#1677ff 0 62%,#edf0f5 62% 100%);position:relative}.gauge:after{content:"";position:absolute;inset:18px 18px 0;border-radius:130px 130px 0 0;background:#fff}.gauge strong{position:absolute;z-index:1;bottom:5px;font-size:26px}.empty{padding:40px;text-align:center;color:#a0a8b5}.notice{padding:10px 14px;background:#e6f4ff;color:#0958d9;border-radius:6px;margin-bottom:14px}.hide{display:none!important}@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}@media(max-width:700px){.side{width:74px}.brand span,.nav button span{display:none}.content{padding:14px}.metrics,.three{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="side"><div class="brand"><div class="logo">做</div><span>让我做</span></div><nav class="nav" id="nav"></nav></aside>
  <main class="main"><header class="top"><div class="crumb">让我做 / <span id="crumb">运营概览</span></div><div class="user"><span class="avatar">管</span>系统管理员</div></header><div class="content" id="content"></div></main>
</div>
<script>
const pages=[['dashboard','运营概览'],['members','会员管理'],['memberDetail','会员详情（原型）'],['helpers','帮手关系'],['tasks','任务管理'],['feedback','小程序反馈']];
const nav=document.getElementById('nav'),content=document.getElementById('content');
pages.forEach(([id,name])=>{const b=document.createElement('button');b.dataset.id=id;b.innerHTML=(id==='dashboard'?'▦ ':id==='members'?'◎ ':id==='tasks'?'▤ ':'◇ ')+`<span>${name}</span>`;b.onclick=()=>show(id);nav.appendChild(b)});
const title=t=>`<div class="page-title"><div><h1>${t}</h1><div class="muted">数据更新至刚刚 · 所有指标按有效业务数据统计</div></div><button class="btn">导出报表</button></div>`;
const metrics=(items)=>`<div class="grid metrics">${items.map(x=>`<div class="card metric"><div class="label">${x[0]}</div><strong>${x[1]}</strong><small>${x[2]||''}</small></div>`).join('')}</div>`;
const bars=`<div class="chart">${[42,58,48,76,68,88,96,74,104,91,116,108].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${i+1}日</span></div>`).join('')}</div>`;
const status=s=>({'已完成':'green','进行中':'blue','待接受':'orange','已逾期':'red','待处理':'orange','处理中':'blue'}[s]||'');
function dashboard(){return title('运营概览')+metrics([['注册会员','1,286','今日 +18'],['好友关系','2,914','本周 +126'],['任务总数','3,762','今日 +42'],['任务完成率','82.6%','较上周 +2.1%'],['完成准时率','91.8%','1,024 个完成样本'],['待处理反馈','12','需及时跟进']])+`<div class="grid two"><section class="card"><h3>注册与任务趋势</h3>${bars}</section><section class="card"><h3>任务状态分布</h3><div class="donut"></div><div style="text-align:center" class="muted">已完成 42% · 进行中 28% · 其他 30%</div></section></div><section class="card" style="margin-top:14px"><h3>最新注册会员</h3>${memberTable(4)}</section>`}
function memberTable(n=6){return `<div class="table-wrap"><table><thead><tr><th>会员</th><th>好友</th><th>发出任务</th><th>参与任务</th><th>完成</th><th>准时率</th><th>最近登录</th><th>操作</th></tr></thead><tbody>${Array.from({length:n},(_,i)=>`<tr><td><span class="avatar" style="width:26px;height:26px;margin-right:8px">${'林周陈许吴郑'[i]}</span>${['林间小满','周末不忙','陈同学','许愿星','吴先生','郑在忙'][i]}</td><td>${8+i*2}</td><td>${21+i*3}</td><td>${16+i*2}</td><td>${14+i}</td><td>${[96,91,88,100,85,93][i]}%</td><td>2026-10-29 ${14-i}:20</td><td><a class="link" onclick="show('memberDetail')">查看详情</a></td></tr>`).join('')}</tbody></table></div>`}
function filters(type){return `<div class="card filters"><div class="field"><label>关键字</label><input class="input" placeholder="昵称 / ID / 标题"></div><div class="field"><label>状态</label><select><option>全部状态</option><option>${type==='task'?'进行中':'正常'}</option></select></div><div class="field"><label>创建时间</label><input class="input" value="2026-10-01 至 2026-10-29" readonly></div><button class="btn primary">查询</button><button class="btn">重置</button></div>`}
function members(){return title('会员管理')+filters()+`<section class="card">${memberTable()}<div style="text-align:right;margin-top:16px" class="muted">共 1,286 条　‹ 1 2 3 … 65 ›　10 条/页</div></section>`}
function memberDetail(){return `<div class="page-title"><div><button class="btn" onclick="show('members')">← 返回会员列表</button><h1 style="margin-top:12px">会员详情</h1></div></div><section class="card profile"><span class="avatar">林</span><div><h2 style="margin:0">林间小满 <span class="tag green">正常</span></h2><div class="muted">会员 ID：10086　邀请码：LMD8K2　注册：2026-08-16 09:30</div></div></section><div style="height:14px"></div>`+metrics([['好友','12'],['发出任务','36'],['参与任务','28'],['已完成','24'],['准时完成','22'],['准时率','91.7%']])+`<div class="grid two"><section class="card"><h3>个人任务表现</h3>${bars}</section><section class="card"><h3>完成准时率</h3><div class="gauge"><strong>91.7%</strong></div><p class="muted" style="text-align:center">22 / 24 个完成样本按时提交</p></section></div><section class="card" style="margin-top:14px"><h3>帮手与任务记录</h3>${memberTable(3)}</section>`}
function helpers(){return title('帮手关系')+filters()+`<section class="card"><div class="notice">关系按双向双写记录展示；全站统计按双方 ID 去重计算好友对。</div><table><thead><tr><th>会员</th><th>帮手</th><th>备注</th><th>建立时间</th><th>状态</th></tr></thead><tbody>${['林间小满|周末不忙|家人','陈同学|许愿星|室友','吴先生|郑在忙|同事'].map(x=>{let a=x.split('|');return `<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>2026-10-26 12:30</td><td><span class="tag green">有效</span></td></tr>`}).join('')}</tbody></table></section>`}
function tasks(){return title('任务管理')+filters('task')+`<section class="card"><table><thead><tr><th>任务</th><th>委托人</th><th>状态</th><th>参与进度</th><th>截止时间</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${[['下班带一份晚餐','林间小满','已完成','2/2'],['周末一起整理房间','陈同学','进行中','1/3'],['记得缴纳本月电费','周末不忙','待接受','0/1'],['取快递并核对物品','许愿星','已逾期','0/2']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="tag ${status(x[2])}">${x[2]}</span></td><td>${x[3]}</td><td>2026-10-30 18:00</td><td>2026-10-28 09:20</td><td><a class="link">详情</a></td></tr>`).join('')}</tbody></table></section>`}
function feedback(){return title('小程序反馈')+filters()+`<section class="card"><table><thead><tr><th>反馈内容</th><th>类型</th><th>提交会员</th><th>状态</th><th>提交时间</th><th>处理人</th><th>操作</th></tr></thead><tbody>${[['希望任务可以按日期筛选','功能建议','林间小满','待处理'],['上传图片后偶现预览失败','问题反馈','陈同学','处理中'],['已解决：登录状态异常','问题反馈','吴先生','已完成']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><span class="tag ${status(x[3])}">${x[3]}</span></td><td>2026-10-29 10:20</td><td>管理员</td><td><a class="link">处理 / 回复</a></td></tr>`).join('')}</tbody></table></section>`}
function show(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));document.getElementById('crumb').textContent=pages.find(x=>x[0]===id)[1];content.innerHTML=({dashboard,members,memberDetail,helpers,tasks,feedback}[id])();window.scrollTo(0,0)}show('dashboard');
</script>
</body>
</html>
